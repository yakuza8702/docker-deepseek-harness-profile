# dsh-browser-mcp — the browser tooling as ONE switchable MCP row.
#
# This is the fragment the entrypoint seeds into a profile's own patch layer
# (`$DSH_HOME/profiles/<name>/cordis.patch.yml`) on first boot. It lives in the
# image as `/opt/seek-harness/browser-mcp.patch.yml`; see docker/entrypoint.sh
# (seed_browser_mcp_row).
#
# WHY A ROW AND NOT A PROVIDER
# ----------------------------
# The browser tools used to come from `@deepseek-ai/dsh-browser-use` +
# `@deepseek-ai/dsh-experimental-browser-use-playwright-mcp`, mounted by a
# launcher overlay. That made them ALWAYS ON: they cost ~10k tokens of static
# context in every Session, they ran one MCP process per activated Session
# (~110-130 MB each), and upstream's attach mode reserves the browser for a
# single Session (which this fork had to patch out).
#
# The same tools, reached through `@deepseek-ai/dsh-mcp-client` directly:
#   * appear in the Plugin list as an ordinary, togglable row (`browser-mcp`);
#   * disappear COMPLETELY when switched off — no server, no tools, no tokens;
#   * toggling is live (the profile patch is watched), so no restart is needed;
#   * cost ONE MCP process for the whole harness instead of one per Session;
#   * need no upstream patch: a plain MCP client has no exclusive attach mode.
#
# The tools keep the exact same names, because the namespace is the serverName:
#   mcp__playwright-mcp__browser_*      (identical to the provider's output)
#
# WHAT IT ATTACHES TO
# -------------------
# The visible Brave desktop this image already runs (Xvfb -> openbox -> Brave on
# 127.0.0.1:$DSH_CDP_PORT). Attach mode means the model and the human share one
# browser: the same tabs, cookies and logins, visible in the noVNC panel.
#
# SWITCHES
# --------
#   DSH_BROWSER_MCP=0            do not seed the row at all (no browser tools)
#   DSH_DESKTOP_ENABLED=0        no desktop stack => the row is disabled too
#   DSH_CDP_PORT=9222            the browser's DevTools port inside the container
#   DSH_BROWSER_MCP_TIMEOUT=...  per-tool-call timeout in ms (default 60000)
#
# Toggling: Plugin list -> `browser-mcp` -> off/on. The plugin manager writes a
# `- id: browser-mcp` / `disabled: true|false` override into the SAME profile
# patch file, and the loader recomposes live.
- insert:
    - id: browser-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "process.env.DSH_BROWSER_MCP === '0' || process.env.DSH_DESKTOP_ENABLED === '0'"
      config:
        serverName: playwright-mcp
        transport: stdio
        # A stable path, so the row never has to know whether DSH came from the
        # npm channel (/opt/dsh) or the source channel (/opt/dsh-src).
        command: /usr/local/bin/dsh-playwright-mcp
        args:
          - --browser
          - chromium
          - --cdp-endpoint
          - !!js "'http://127.0.0.1:' + (process.env.DSH_CDP_PORT || '9222')"
        env: {}
        toolCallTimeoutMs: !!js "Number(process.env.DSH_BROWSER_MCP_TIMEOUT || 60000)"
