# =====================================================================
# docker-build — keep :latest always current with the official
# deepseek-ai/deepseek-harness releases.
#
# * schedule     : every 6h resolve the newest release on the chosen
#                  channel; if a build for that version (+this repo
#                  commit) is not already on GHCR, build and push.
# * manual       : run from the Actions tab anytime (force_build to skip
#                  the already-built check).
# * registry     : ghcr.io/<owner>/<repo> — uses only the built-in
#                  GITHUB_TOKEN, no secrets required.
# * tags pushed  : latest, dsh-<version>, build-<version>-<sha8>
# * platforms    : linux/amd64 (default) — arm64 opt-in via workflow input
# * virgl        : opt-in build of the personal-VM QEMU with virtio-gpu-gl-pci
#                  (workflow input `virgl`, or repo variable DSH_WITH_VIRGL_QEMU=1)
#                  or repo variable vars.DSH_PLATFORMS (source builds for
#                  arm64 run under slow QEMU emulation, avoid on free runners)
#
# CHANNELS
#   npm (default) : @deepseek-ai/dsh dist-tags.latest — the OFFICIAL
#                   release channel (`npx @deepseek-ai/dsh web`); also
#                   what runzhliu & smanx package. Fast, slim, pinned.
#                   NOTE: GitHub-only pre-releases/alphas that were never
#                   published to npm cannot be installed this way.
#   github-tag    : newest `dsh-v*` tag on the official GitHub repo —
#                   INCLUDES pre-releases/alphas. Builds the upstream
#                   monorepo from source (slow, much larger image).
#                   Use for bleeding-edge tags like dsh-v0.1.2-alpha.1.
#                   Resolution order: `git ls-remote --tags` (git protocol,
#                   no REST API, no rate limit) → the tags API WITH the
#                   workflow token → unauthenticated tags API. Finding no
#                   dsh-v* tag at all is a hard error, not a silent fallback.
#
# Channel selection: workflow input (manual runs) > repository variable
# `vars.DSH_CHANNEL` (also applies to the cron) > default "npm".
# =====================================================================
name: docker-build

on:
  # A push to main builds the image immediately. `main` is now the ONLY branch:
  # every feature branch (browser stack, Office, APK toolchain, isolated Docker,
  # profile management, the profile chooser + reset, the alpha.2 re-anchor) has
  # been merged into it, so this single trigger is the whole build surface — and
  # `:latest` now carries the browser stack that a stack pulling it expects.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "@deepseek-ai/dsh version to build (default: latest on npm)"
        required: false
        default: "latest"
      channel:
        description: "Release channel (overrides vars.DSH_CHANNEL)"
        type: choice
        default: ""
        options:
          - ""
          - npm
          - github-tag
      force_build:
        description: "Skip the already-built check and rebuild"
        type: boolean
        default: false
      platforms:
        description: "Target platforms (comma-separated). Default linux/amd64. arm64 needs QEMU and makes source builds 5-15x slower"
        required: false
        default: "linux/amd64"
      virgl:
        description: "Build with the virgl-capable QEMU (GPU acceleration for the personal VM; +~200 MB, needs /dev/dri on the host)"
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Upstream DSH release this image is built from when the run has no inputs
  # (push and schedule events). A manual run may override `dsh_version`.
  #
  # EMPTY = follow npm's `latest` dist-tag automatically: push and cron runs
  # resolve whatever upstream publishes (today 0.2.0-rc.2) with no commit here.
  # Set a version string to freeze the image instead.
  #
  # The browser-use packages are installed at the version this resolves to (see
  # the Dockerfile), so a core release with no matching browser-use release yet
  # falls back to that package's `next` tag and says so in the build log.
  DSH_VERSION_PIN: ""
  # The cua CLI baked into the image — the Dockerfile's CUA_CLI_VERSION ARG.
  # "latest" (default) resolves the newest cua-sdk-v* release from the GitHub
  # releases API at BUILD time; the build FAILS if that lookup fails, so an
  # image can never say "latest" and carry an old CLI. Set a version to pin.
  # Same shape as DSH_VERSION_PIN: an env here (or a repo variable of the same
  # name) is the only place the value lives.
  CUA_CLI_VERSION: "latest"
  # The OpenCode CLI baked into the image — the Dockerfile's OPENCODE_VERSION ARG.
  # "latest" (default) resolves the newest `v1.*` release from the GitHub releases
  # API at BUILD time, skipping every v2 tag (dsh-opencode-connect — which the USER
  # installs from the Plugins page — speaks the v1 API paths, and a 2.x CLI answers
  # none of them). The build FAILS if that lookup fails, if no v1 tag exists, or if
  # the version is below the plugin's 1.18.0 floor, so an image can never say
  # "latest" and carry a CLI the plugin cannot drive. Set a version to pin.
  OPENCODE_VERSION: "latest"

jobs:
  check:
    name: Resolve upstream + decide build
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.upstream.outputs.version }}
      source_ref: ${{ steps.upstream.outputs.source_ref }}
      channel: ${{ steps.upstream.outputs.channel }}
      should_build: ${{ steps.decide.outputs.should_build }}
      build_key: ${{ steps.decide.outputs.build_key }}
    steps:
      - name: Resolve channel + latest upstream DSH version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          # Event inputs arrive as ENV, never spliced into the shell text: an input
          # that carries a quote or a $(...) must stay data, and the old inline
          # `[ "${{ github.event.inputs.dsh_version }}" != "latest" ]` rendered as
          # a literal `[ "latest" != "latest" ]` on a default run — correct, but it
          # read like templating debris. The comparison itself is NOT dead: on a
          # manual run with a non-"latest" dsh_version it selects that version, and
          # VER feeds build_key / :dsh-<ver> / the DSH_VERSION build-arg below.
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL_INPUT: ${{ github.event.inputs.channel }}
          VERSION_INPUT: ${{ github.event.inputs.dsh_version }}
          DSH_CHANNEL_VAR: ${{ vars.DSH_CHANNEL }}
          UPSTREAM_REPO: deepseek-ai/deepseek-harness
        run: |
          set -euo pipefail

          UPSTREAM_REPO_URL="https://github.com/${UPSTREAM_REPO}.git"
          TAG_PATTERN='refs/tags/dsh-v*'

          # --- newest dsh-v* tag from a list of tag NAMES on stdin -------------
          # Ordering = GNU version sort on the version part, with a FINAL release
          # ranked above the pre-releases of its own base. Plain `sort -V` gets
          # that wrong: a shorter string loses to its own extension, so
          # 0.2.1-rc.5 would outrank 0.2.1. Annotated-tag dereference entries
          # (`dsh-v0.2.1-alpha.2^{}`) are stripped and de-duplicated first.
          # Returns 1 (printing nothing) when the list holds no dsh-v* tag.
          newest_dsh_tag() {
            local tags decorated
            tags="$(sed -e 's/\^{}$//' | grep -E '^dsh-v[0-9]' | sort -u || true)"
            if [ -z "$tags" ]; then
              return 1
            fi
            decorated="$(printf '%s\n' "$tags" | awk '
              {
                ver  = substr($0, 6)                      # strip the "dsh-v" prefix
                dash = index(ver, "-")
                if (dash > 0) { base = substr(ver, 1, dash - 1); rank = 0 }  # pre-release
                else          { base = ver;                        rank = 1 }  # final release
                printf "%s\t%d\t%s\n", base, rank, $0
              }')"
            printf '%s\n' "$decorated" \
              | sort -t "$(printf '\t')" -k1,1V -k2,2n -k3,3V \
              | tail -n 1 | cut -f3
          }

          # --- PRIMARY: git ls-remote (no REST API, no rate limit) -------------
          # `git ls-remote --tags <url> <pattern>` asks the git server directly for
          # refs; returns annotated ^{} lines too, which newest_dsh_tag strips.
          tags_from_git() {
            local listing
            listing="$(git ls-remote --tags "$UPSTREAM_REPO_URL" "$TAG_PATTERN")" || return 1
            printf '%s\n' "$listing" | awk 'NF >= 2 { print $2 }' | sed -e 's#^refs/tags/##'
          }

          # --- FALLBACK: REST API, authenticated when a token is present -------
          # GH_TOKEN is sent as a bearer token only when non-empty; unauthenticated
          # curl is the last resort (60 req/h — that is what returned the 403).
          tags_from_api() {
            local page url names acc="" count curl_hdrs=()
            if [ -n "${GH_TOKEN:-}" ]; then
              curl_hdrs=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
            for page in 1 2 3 4 5; do
              url="https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=100&page=${page}"
              names="$(curl -fsSL --max-time 30 --retry 2 --retry-delay 2 \
                ${curl_hdrs[@]+"${curl_hdrs[@]}"} \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url" \
                | python3 -c 'import json,sys; [print(t["name"]) for t in json.load(sys.stdin)]')" || return 1
              count="$(printf '%s' "$names" | grep -c . || true)"
              acc="${acc}${names}"$'\n'
              if [ "$count" -lt 100 ]; then
                break
              fi
            done
            printf '%s' "$acc"
          }

          # --- npm `latest` dist-tag, with retry/backoff -----------------------
          npm_latest_version() {
            local url='https://registry.npmjs.org/@deepseek-ai%2Fdsh' attempt=1 delay=2 body ver
            while :; do
              if body="$(curl -fsSL --max-time 30 "$url")"; then
                if ver="$(printf '%s' "$body" \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["dist-tags"]["latest"])')" \
                  && [ -n "$ver" ]; then
                  printf '%s\n' "$ver"
                  return 0
                fi
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "::error::could not resolve dist-tags.latest of @deepseek-ai/dsh from ${url} after ${attempt} attempts" >&2
                return 1
              fi
              echo "npm registry resolution attempt ${attempt} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # channel precedence: workflow input > repo variable vars.DSH_CHANNEL > npm
          CH="${CHANNEL_INPUT:-${DSH_CHANNEL_VAR:-npm}}"
          case "$CH" in npm|github-tag) ;; *) echo "::error::Unknown channel '$CH'"; exit 1;; esac
          echo "channel=${CH}" >> "$GITHUB_OUTPUT"

          if [ "$CH" = "github-tag" ]; then
            # newest dsh-v* tag from the official repo (includes pre-releases)
            TAG=""
            GIT_ERR=""
            if GIT_LIST="$(tags_from_git 2>/dev/null)"; then
              TAG="$(printf '%s\n' "$GIT_LIST" | newest_dsh_tag)" || TAG=""
            else
              GIT_ERR="git ls-remote failed"
            fi
            if [ -z "$TAG" ]; then
              if [ -n "$GIT_ERR" ]; then
                echo "${GIT_ERR}; falling back to the GitHub tags API" >&2
              fi
              if API_LIST="$(tags_from_api)"; then
                TAG="$(printf '%s\n' "$API_LIST" | newest_dsh_tag)" || TAG=""
              fi
            fi
            if [ -z "$TAG" ]; then
              echo "::error::No 'dsh-v*' tag found in ${UPSTREAM_REPO}: git ls-remote '${TAG_PATTERN}' and GET https://api.github.com/repos/${UPSTREAM_REPO}/tags returned no matching tag. Check the repo name and that the tag pattern still exists upstream." >&2
              exit 1
            fi
            VER="${TAG#dsh-v}"
            echo "source_ref=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Upstream source tag: ${TAG} (version ${VER})"
          else
            # A manual run may pin an explicit version; push/schedule runs carry no
            # inputs and follow npm `latest` unless DSH_VERSION_PIN freezes one.
            if [ "${EVENT_NAME:-}" = "workflow_dispatch" ] \
               && [ -n "${VERSION_INPUT:-}" ] \
               && [ "${VERSION_INPUT}" != "latest" ]; then
              VER="${VERSION_INPUT}"
              echo "version from the dsh_version input: ${VER}"
            elif [ -n "${DSH_VERSION_PIN:-}" ]; then
              VER="${DSH_VERSION_PIN}"
              echo "version frozen by DSH_VERSION_PIN"
            else
              VER="$(npm_latest_version)"
            fi
            echo "source_ref=" >> "$GITHUB_OUTPUT"
            echo "Upstream @deepseek-ai/dsh version: ${VER} (npm)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: decide
        env:
          VER: ${{ steps.upstream.outputs.version }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          SHA8="$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)"
          KEY="build-${VER}-${SHA8}"
          echo "build_key=${KEY}" >> "$GITHUB_OUTPUT"
          if [ "${FORCE}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "force_build requested -> building"
            exit 0
          fi
          if docker manifest inspect "${IMAGE}:${KEY}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Image for dsh ${VER} + commit ${SHA8} already on GHCR -> skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No image for dsh ${VER} + commit ${SHA8} -> building"
          fi

  build:
    name: Build & push (${{ github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64' }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (only needed for arm64)
        if: contains((github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64'), 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64' }}
          push: true
          build-args: |
            DSH_VERSION=${{ needs.check.outputs.dsh_version }}
            DSH_SOURCE_REF=${{ needs.check.outputs.source_ref }}
            CUA_CLI_VERSION=${{ vars.CUA_CLI_VERSION || env.CUA_CLI_VERSION }}
            OPENCODE_VERSION=${{ vars.OPENCODE_VERSION || env.OPENCODE_VERSION }}
            # Opt-in GPU support: the distro QEMU plus qemu-system-modules-opengl
            # (the package that carries virtio-gpu-gl-pci) and virgl/Mesa.
            # DSH_CUA_VM_GPU=virgl at runtime then switches cua onto it.
            WITH_VIRGL_QEMU=${{ (github.event.inputs.virgl == 'true' || vars.DSH_WITH_VIRGL_QEMU == '1') && '1' || '0' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:dsh-${{ needs.check.outputs.dsh_version }}
            ${{ env.IMAGE }}:${{ needs.check.outputs.build_key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## seek-harness image updated"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Channel | \`${{ needs.check.outputs.channel }}\` |"
            echo "| Upstream version | \`${{ needs.check.outputs.dsh_version }}\` |"
            echo "| Image | \`${{ env.IMAGE }}:latest\` |"
            echo "| Version tag | \`:dsh-${{ needs.check.outputs.dsh_version }}\` |"
            echo "| Build tag | \`${{ needs.check.outputs.build_key }}\` |"
            echo "| Platforms | \`${{ github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64' }}\` |"
            echo "| virgl QEMU | \`${{ (github.event.inputs.virgl == 'true' || vars.DSH_WITH_VIRGL_QEMU == '1') && 'on' || 'off' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
