# =====================================================================
# seek-harness — hardened deployment (runzhliu-style hardening)
#
#   cp .env.example .env   (then edit)
#   docker compose pull
#   DSH_WORKSPACE=/abs/path/to/project docker compose up -d
#
# Security model (base compose keeps everything locked down):
#   * DSH listens on 127.0.0.1 INSIDE the container (upstream refuses
#     0.0.0.0 by design); the built-in reverse proxy is the only public
#     surface (the "0.0.0.0 fix").
#   * Publishes to 127.0.0.1 by default. For LAN access set DSH_BIND=0.0.0.0 —
#     the proxy auto-mints browser sessions from dsh web's boot token
#     (zero-auth LAN). Set PROXY_USERNAME+PROXY_PASSWORD to require Basic
#     Auth if other LAN devices should stay out.
#   * cap_drop ALL / no-new-privileges / read-only rootfs / tmpfs /tmp.
#   * The browser desktop (official Browser Use + noVNC human takeover) shares
#     the SAME published port: the proxy path-routes /desktop/ to a loopback
#     noVNC, so there is no second port to forward and the panel inherits the
#     proxy's auth. The browser profile (cookies, logins, extensions) persists
#     in the dsh-home volume.
#   * Only the workspace bind is writable. Never mount ~, .ssh, cloud
#     credentials, or docker.sock into the BASE compose file — use the
#     compose.docker.yaml override for docker access.
# =====================================================================

services:
  seek-harness:
    image: ghcr.io/yakuza8702/docker-deepseek-harness-profile:latest
    container_name: seek-harness
    restart: unless-stopped
    ports:
      # DSH_BIND=127.0.0.1 (default, local only) or 0.0.0.0 (LAN, needs auth)
      - "${DSH_BIND:-127.0.0.1}:${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      # 0.0.0.0 fix: DSH loopback port + public proxy port (must differ)
      DSH_PORT: "${DSH_PORT:-3079}"
      PROXY_PORT: "${PROXY_PORT:-3080}"
      PROXY_HOST: "0.0.0.0"
      # Optional Basic Auth on HTTP + WebSocket (enabled only when BOTH set)
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
      # Extra authorities for DSH's /api browser-trust fence (comma list).
      # OPTIONAL/legacy — the proxy now translates same-origin markers itself;
      # only useful if you expose DSH's port without its proxy.
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
      # Docker engine access — either TCP proxy…
      DOCKER_HOST: "${DOCKER_HOST:-}"
      # …or mount /var/run/docker.sock via the compose.docker.yaml override
      # FIX 2026-09-01: proxy "unlock remote settings" JS rewrite regex only
      # matched the LAST dotted segment; on newer upstream code it corrupted
      # the served bundle (ctx.remote.$host.isLoopback ? ... -> ctx.remote."host"
      # = SyntaxError). Patched proxy + settings shim are bind-mounted below.
      # PROXY_UNLOCK_REMOTE_SETTINGS=1 keeps the (now-safe) rewrite feature on;
      # set to 0 to disable the feature entirely (stock behaviour).
      PROXY_UNLOCK_REMOTE_SETTINGS: "${PROXY_UNLOCK_REMOTE_SETTINGS:-1}"
      # upstream runtime knobs (safe defaults; see README)
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-1}"
      DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE:-}"
      DSH_TOOLS_MODE: "${DSH_TOOLS_MODE:-}"
      # --- browser desktop (Browser Use + human takeover) ---
      # There is deliberately NO desktop port here: Xvfb/x11vnc/websockify and
      # the browser all bind 127.0.0.1 inside the container and the reverse
      # proxy path-routes /${DSH_DESKTOP_PREFIX:-desktop}/ to noVNC on the SAME
      # published port. That is what lets an https reverse proxy (Pangolin /
      # nginx) embed the panel — a separately published http://host:6080 would
      # be blocked as mixed content on an https UI, and would bypass the proxy's
      # Basic Auth.
      DSH_DESKTOP_ENABLED: "${DSH_DESKTOP_ENABLED:-1}"
      DSH_BROWSER_USE_ENABLED: "${DSH_BROWSER_USE_ENABLED:-1}"
      # 0 (default) = every Session drives the SAME visible browser, so browser
      # tools are always present; cookies/logins/tabs are shared between
      # Sessions. 1 = upstream's single-owner attachment, where one Session
      # reserves the browser and the rest silently never get the tools.
      DSH_BROWSER_USE_EXCLUSIVE: "${DSH_BROWSER_USE_EXCLUSIVE:-0}"
      DSH_DESKTOP_PREFIX: "${DSH_DESKTOP_PREFIX:-desktop}"
      DSH_NOVNC_PORT: "${DSH_NOVNC_PORT:-6080}"
      DSH_CDP_PORT: "${DSH_CDP_PORT:-9222}"
      DSH_DESKTOP_WIDTH: "${DSH_DESKTOP_WIDTH:-1440}"
      DSH_DESKTOP_HEIGHT: "${DSH_DESKTOP_HEIGHT:-900}"
    env_file:
      - path: .env
        required: false
    volumes:
      # DSH state: profiles / settings / credentials / sessions / storage
      # The browser profile lives here too ($DSH_HOME/brave-profile), which is
      # what makes logins, cookies and installed extensions survive a restart.
      - dsh-home:/home/node/.dsh
      # Agent workspace (the Web UI dir-selector treats /workspace as HOME)
      - ${DSH_WORKSPACE:-./workspace}:/workspace
      # NOTE 2026-10-01: the ./overrides/proxy.mjs bind-mount was REMOVED. It
      # carried the 2026-09-01 dotted-chain regex fix as a runtime patch over the
      # image copy — but the image's docker/proxy.mjs has owned that fix (plus
      # the recovery surface, the client-boot watchdog and the /desktop route)
      # since the diagnostic-screen work, so the stale 415-line copy silently
      # shadowed every later proxy change. The image copy is now authoritative.
      #
      # FIX 2026-09-01: re-export settingsNamespace (made internal upstream in
      # 0.1.2-alpha.3) so ecosystem plugins that still import it keep loading.
      # Remove once the plugins ship alpha3-compatible releases.
      - ./overrides/settings-index.js:/opt/dsh-src/packages/settings/settings/lib/index.js:ro
      # FIX 2026-09-01: guarantee the Landlock launcher even if the image was
      # built before the Dockerfile fix (arch mapping bug left source-channel
      # images without the binary — sandbox modes failed closed). Harmless when
      # the image already bundles it: the mount shadows it with the same
      # contract binary. Remove once all your nodes run a fixed image.
      - ./overrides/landlock-run/linux-x64/landlock-run:/opt/dsh-src/native/landlock-run/packages/linux-x64/bin/landlock-run:ro
    # Chromium-derived browsers use /dev/shm for renderer shared memory; the
    # 64 MB default makes heavy pages crash the renderer. The entrypoint detects
    # a small /dev/shm and falls back to --disable-dev-shm-usage, so this is the
    # fast path rather than a requirement.
    shm_size: "1g"
    # Writable temp space, required because of `read_only: true` below: Node,
    # npm/pnpm caches, python, uv/uvx temp venvs (MCP servers), gcc — and the
    # browser's XDG config/cache/runtime plus its display logs. `exec` lets them
    # execute files placed there. size=2g caps RAM usage (1g was tight once the
    # browser shares this tmpfs).
    tmpfs:
      - /tmp:exec,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: false # tini runs INSIDE the image (PID 1, orphan reaping)

volumes:
  dsh-home:
