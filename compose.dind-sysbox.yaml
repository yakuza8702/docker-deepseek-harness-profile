# =====================================================================
# OPTIONAL override ON TOP of compose.dind.yaml — the same isolated engine,
# under Sysbox, with NO privileges at all.
#
#   docker compose -f compose.yaml -f compose.dind.yaml -f compose.dind-sysbox.yaml up -d
#
# Requires Sysbox CE on the host (`sysbox-runc` registered): README "Option C".
# Exactly two fields change — the runtime, and `privileged: false`. Everything
# else is identical: same private network, same never-published 2375, same
# /export hand-off.
#
# User-namespace mapping, purge notes and host pre-flight: docs/compose-hardening.md.
# =====================================================================

services:
  dind:
    runtime: sysbox-runc
    # Sysbox supplies the isolation — the container needs no privilege.
    privileged: false
