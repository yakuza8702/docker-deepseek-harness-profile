# =====================================================================
# OPTIONAL override — Docker engine access via the host docker.sock.
#
#   docker compose -f compose.yaml -f compose.docker.yaml up -d
#
# SECURITY: this is root-equivalent access to the HOST daemon. Prefer the
# isolated engine (compose.dind.yaml) or a filtered TCP proxy
# (DOCKER_HOST=tcp://docker-socket-proxy:2375 in .env). Only one mount line,
# and that is the whole point of it being an override.
#
# Ranking of the three engines, and why the socket is last:
# docs/compose-hardening.md.
# =====================================================================

services:
  seek-harness:
    group_add:
      # gid of the host `docker` group (stat -c %g /var/run/docker.sock)
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
