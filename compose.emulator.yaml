# =====================================================================
# KVM override — the one thing the harness cannot carry in an image: the
# host's /dev/kvm, for the personal-VM supervisor.
#
#   docker compose -f compose.yaml -f compose.emulator.yaml up -d
#
# The file keeps its old name because existing stacks still reference it; it
# used to pass /dev/kvm to the Android emulator, which this image no longer
# ships. The device is now for `cua`, the Linux VM the model builds and tests
# in. Without this override the harness still boots and the VM tools report a
# missing device; with it in the base file the harness would not start at all
# on a host without KVM.
#
# Requirements (host KVM, nested virtualisation, the KVM_GID recipe) and the
# "why an override" argument: docs/compose-hardening.md.
# =====================================================================

services:
  seek-harness:
    devices:
      - /dev/kvm
    group_add:
      - "${KVM_GID:-kvm}"
