# =====================================================================
# WINDOWS computers — a DinD sidecar, and the switch that adds the option
#
#   docker compose -f compose.yaml -f compose.windows.yaml up -d
#
# WHAT THIS ADDS
#   * `dind`: a Docker Engine the harness reaches at tcp://dind:2375. A Windows
#     computer is a container (dockurr/windows) on that engine — see
#     docker/cua-vm-windows.mjs. The harness never runs Windows itself.
#   * DSH_CUA_VM_WINDOWS=1 on the harness, which is what makes `kind: "windows"`
#     appear in the panel at all. DSH_CUA_VM_WINDOWS=0 removes the option
#     entirely (the tools refuse it, the panel hides it).
#
# WHY THE ENGINE NEEDS THE SAME VOLUME
#   The Windows container's `/storage` is a bind of `$STORE/windows/<name>`. For
#   that bind to mean the same directory on both sides — the harness writes the
#   generated password there, the guest sees it as \\host.lan\Data, and QMP
#   `screendump` writes the frame there — the SAME named volume is mounted into
#   both containers at /cua-vm. Without it, a frame falls back to the archive
#   API and the file bridge does not exist.
#
# WHAT THE GUEST GETS
#   /dev/kvm (the VM needs hardware virtualisation), and /dev/dri/renderD128
#   only when the computer was created with "Enable GPU" (GPU=Y + RENDERNODE).
#   The console (8006) is relayed by the supervisor and published at
#   /vm/port/<name>/ — it is never exposed raw. QMP (7100) is never published at
#   all: it is reached on the container's own address, which is why the container
#   joins DSH_CUA_WINDOWS_NETWORK.
#
# RDP — OPT-IN, AND A REAL EXPOSURE
#   RDP (3389) is published by Docker to the DinD container's network namespace.
#   To reach it from the LAN you must publish it on the `dind` service yourself,
#   and that is a deliberate act with a real consequence: an unauthenticated
#   TCP port on the host, one Windows login away from a remote desktop. It is
#   commented out below. If you enable it, put it behind the same SSO/VPN you put
#   in front of the harness, and keep the generated password (the panel reveals
#   it) out of tickets.
#
# REQUIREMENTS
#   * A host with /dev/kvm (nested virtualisation if the host is a VM).
#   * ~80 GB for the Docker engine's images and one Windows disk (DISK_SIZE
#     floors at 64 GB).
#   * The DinD container is `privileged`: that is what an in-container engine
#     needs. It is a SEPARATE container — the harness keeps cap_drop ALL,
#     read-only rootfs and no-new-privileges.
# =====================================================================

services:
  # The engine that owns the Windows containers.
  dind:
    image: docker:27-dind
    container_name: ${CUA_WINDOWS_DIND_NAME:-seek-harness-dind}
    restart: unless-stopped
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
    environment:
      # No TLS between the two containers: the port is on the compose network
      # only (it is never published), and the harness reaches it as dind:2375.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # The VM store, shared with the harness so a Windows /storage bind is the
      # same tree on both sides.
      - cua-vm:/cua-vm
      - dind-storage:/var/lib/docker
    devices:
      - /dev/kvm
      # Drop these two lines on a host without a GPU (and create Windows
      # computers with Enable GPU unticked).
      - /dev/dri
    # NOTHING IS PUBLISHED. Uncomment the RDP mapping below ONLY if you accept a
    # raw 3389 on this host — see "RDP — OPT-IN" above.
    # ports:
    #   - "${DSH_CUA_WINDOWS_RDP_BIND:-127.0.0.1}:${DSH_CUA_WINDOWS_RDP_PORT:-13389}:3389"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  seek-harness:
    depends_on:
      dind:
        condition: service_healthy
    environment:
      # The Windows backend talks to THIS engine, not to the harness's own.
      DOCKER_HOST: "tcp://dind:2375"
      # 1 = the Windows option exists, 0 = it does not (kill switch).
      DSH_CUA_VM_WINDOWS: "${DSH_CUA_VM_WINDOWS:-1}"
      # The network the Windows containers join, so the supervisor can reach
      # their unpublished QMP port on the container address.
      DSH_CUA_WINDOWS_NETWORK: "${COMPOSE_PROJECT_NAME:-docker-deepseek-harness-profile}_default"
      DSH_CUA_WINDOWS_IMAGE: "${DSH_CUA_WINDOWS_IMAGE:-dockurr/windows:4.35}"
      CUA_WINDOWS_RENDERNODE: "${CUA_WINDOWS_RENDERNODE:-/dev/dri/renderD128}"
    # dind publishes its ports on its own namespace; the supervisor connects to
    # the published console/RDP ports through the service name.
    links:
      - dind

volumes:
  dind-storage:
