# =====================================================================
# WINDOWS computers — direct QEMU, no Docker Engine
#
#   docker compose -f compose.yaml -f compose.windows.yaml up -d
#
# WHAT THIS ADDS
#   * the host devices and groups a Windows guest needs: /dev/kvm (the same
#     one the Linux guest uses) and, only if you want the virtio-gpu display,
#     /dev/dri with the render/video GIDs;
#   * DSH_CUA_VM_WINDOWS=1, which is what makes `kind: "windows"` appear at all
#     (0 removes the option entirely);
#   * the two QEMU/serial paths a Windows boot writes, on the same /cua-vm
#     volume as everything else.
#
# WHAT IT DELIBERATELY DOES NOT ADD
#   No second container engine, no privileged sidecar, no extra runtime. A Windows computer
#   is `qemu-system-x86_64` started by the SAME supervisor that runs the Linux
#   guest: OVMF + swtpm + a qcow2 disk under /cua-vm, QMP and VNC on loopback,
#   and SLIRP networking. The harness keeps cap_drop ALL, read-only rootfs and
#   no-new-privileges — nothing here adds a capability.
#
# NETWORKING
#   QEMU user-mode networking (SLIRP): the guest gets outbound internet (so it
#   can fetch testing harnesses, Windows Update and pip packages) and reaches
#   HOST services through the gateway 10.0.2.2 — e.g. a site the model serves on
#   the harness at :3079 is http://10.0.2.2:3079/ inside Windows. SSH is
#   forwarded from 127.0.0.1:<allocated> to guest :22, which is what
#   cua_vm_exec/put/get use.
#   A tap/bridge interface is possible for real LAN presence, but it needs
#   CAP_NET_ADMIN and a host bridge, so it is NOT the default and is not wired
#   here (see the README's "Bridge networking" note).
#
# INSTALL MEDIA AND STORE
#   Everything Windows lives under /cua-vm:
#     /cua-vm/iso/                 downloaded install media (one per version)
#     /cua-vm/windows/<name>/      disk.qcow2, efi-vars.qcow2, tpm/, oem/,
#                                  credentials.json, id_ed25519, serial.log
#   The ISO is downloaded once (Microsoft's evaluation URLs, ~5.5 GB) or taken
#   from windowsIso (a URL, or a file inside the store). The virtio-win drivers
#   ISO is OPTIONAL: put it at /cua-vm/iso/virtio-win.iso and the guest gets
#   virtio-blk/virtio-net; without it the disk is AHCI and the NIC is e1000e,
#   which stock Windows installs from.
#
# LIVE VIEW
#   The display is QEMU VNC on loopback, relayed through websockify+noVNC to
#   /vm/port/<name>/ — the panel's "Show VM" streams it and a human can drive
#   the same screen the model is driving. Nothing is published raw.
# =====================================================================

services:
  seek-harness:
    devices:
      - /dev/kvm
      # Drop this line on a host without a GPU; create Windows computers with
      # "Enable GPU" unticked in that case.
      - /dev/dri
    group_add:
      # Numeric GIDs: names resolve inside the image, not on the host.
      - "${KVM_GID:-kvm}"
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    environment:
      DSH_CUA_VM_WINDOWS: "${DSH_CUA_VM_WINDOWS:-1}"
      # The Windows backend is qemu; these are the tool paths a slim image can
      # place elsewhere (they all have image defaults).
      DSH_CUA_WINDOWS_QEMU: "${DSH_CUA_WINDOWS_QEMU:-/usr/bin/qemu-system-x86_64}"
      DSH_CUA_WINDOWS_OVMF_CODE: "${DSH_CUA_WINDOWS_OVMF_CODE:-/usr/share/OVMF/OVMF_CODE_4M.fd}"
      DSH_CUA_WINDOWS_OVMF_VARS: "${DSH_CUA_WINDOWS_OVMF_VARS:-/usr/share/OVMF/OVMF_VARS_4M.fd}"
      DSH_CUA_WINDOWS_SWTPM: "${DSH_CUA_WINDOWS_SWTPM:-/usr/bin/swtpm}"
      # Optional virtio-win ISO: when present, the disk and NIC become virtio.
      DSH_CUA_WINDOWS_VIRTIO_ISO: "${DSH_CUA_WINDOWS_VIRTIO_ISO:-}"
      # The guest's dsh-cua MCP tools are attached lazily; 0 disables the path.
      DSH_CUA_VM_WIN_MCP: "${DSH_CUA_VM_WIN_MCP:-1}"

volumes: {}

# ---------------------------------------------------------------------
# HARDENING NOTES — comments only, deliberately not keys.
#
# * read_only: the harness rootfs stays read-only (compose.yaml). Everything a
#   Windows computer writes lands in the /cua-vm volume — disk.qcow2,
#   efi-vars.qcow2, tpm/, oem/, serial.log, credentials.json — or in /tmp
#   (tmpfs). Do NOT mount the store read-only to "harden" it: QEMU writes the
#   disk image and swtpm writes its state, so a read-only store is a boot
#   failure, not a hardening.
#
# * Suggested ceilings for a full Windows install plus a running guest, as
#   COMMENTS on purpose — a real key here would OOM-kill the install halfway
#   through on a host that would otherwise have finished it:
#       mem_limit: 12g
#       pids_limit: 512
#   QEMU reserves the guest's RAM eagerly (chunks of 1 GB), so mem_limit has to
#   cover guest memory + OVMF + swtpm + the supervisor. Lower the guest's RAM
#   before lowering this.
#
# * tap/bridge networking is NOT supported by this file. It needs CAP_NET_ADMIN
#   (the harness runs cap_drop ALL) and a host bridge; SLIRP user-mode
#   networking is the only wired path, and the guest still reaches host
#   services at 10.0.2.2. See the README's "Bridge networking" note for what
#   enabling it would require.
# ---------------------------------------------------------------------
