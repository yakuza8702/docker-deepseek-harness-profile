# =====================================================================
# GPU override — a real GL context for the personal VM (virgl), sharing the
# host GPU instead of passing it through.
#
#   docker build --build-arg WITH_VIRGL_QEMU=1 ...   # the default QEMU has no virgl
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
#
# Needs a render node (/dev/dri/renderD128) and, on NVIDIA, the container
# toolkit with the `graphics` capability. Paravirtual GL, not VFIO passthrough
# and not CUDA: the host GPU stays usable.
#
# Guest-side detail (Vulkan/Venus kernel, Mesa and driver floors) and the
# per-file hardening notes: docs/compose-hardening.md.
# =====================================================================
services:
  seek-harness:
    devices:
      - /dev/kvm
      - /dev/dri
    group_add:
      # Numeric GIDs: names are resolved inside the image, not on the host.
      #   getent group render | cut -d: -f3
      #   getent group video  | cut -d: -f3
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    environment:
      # Supervisor: point cua at the system QEMU and pass --gpu virgl.
      DSH_CUA_VM_GPU: "virgl"
      # NVIDIA toolkit: mount every driver capability, GL included.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, graphics, video, compute]
